<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>My-Web-3D-Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background: #121212; color: white; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 90vh; }
        #ui { padding: 15px; background: #222; display: flex; justify-content: space-between; align-items: center; }
        button { padding: 10px 20px; cursor: pointer; background: #ff4757; border: none; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <span>My-Web-3D-Engine v1.0</span>
        <button onclick="saveProject()">প্রজেক্ট সেভ করুন</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        // ইঞ্জিন ইনিশিয়ালাইজেশন
        const canvas = document.getElementById('renderCanvas');
        const gl = canvas.getContext('webgl');
        let projectData = { version: "1.0", scene: "MainScene", objects: [] };

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.9;
            gl.clearColor(0.2, 0.2, 0.2, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
            console.log("My-Web-3D-Engine লোড হয়েছে...");
        }

        // ডাটাবেজ ব্যাকএন্ড কল
        async function saveProject() {
            try {
                const response = await fetch('http://localhost:3000/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(projectData)
                });
                const result = await response.json();
                alert(result.message);
            } catch (err) {
                alert("সার্ভার পাওয়া যায়নি! নিশ্চিত করুন ব্যাকএন্ড সার্ভার চালু আছে।");
            }
        }

        init();
    </script>
</body>
</html>
