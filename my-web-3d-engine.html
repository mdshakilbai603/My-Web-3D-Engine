<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>My-Web-3D-Engine</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #toolbar { position: absolute; top: 0; width: 100%; height: 60px; background: #1a1a1a; display: flex; align-items: center; gap: 20px; padding: 0 20px; z-index: 100; border-bottom: 2px solid #ff4757; }
        canvas { width: 100vw; height: 100vh; display: block; }
        button { padding: 10px 20px; cursor: pointer; background: #ff4757; color: white; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="toolbar">
    <strong style="color:#fff">My-Web-3D-Engine</strong>
    <button onclick="Engine.addObject('Cube')">Add Cube</button>
    <button onclick="Engine.addObject('Light')">Add Light</button>
    <button onclick="Engine.saveProject()">Save Project</button>
</div>
<canvas id="renderCanvas"></canvas>

<script>
    // ইঞ্জিন কোর: সকল সিস্টেম একসাথে
    const Engine = {
        gl: null,
        objects: [],
        camera: { x: 0, y: 0, z: -5 },

        init: function() {
            const canvas = document.getElementById('renderCanvas');
            this.gl = canvas.getContext('webgl');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // রেন্ডারিং ও ইনপুট সিস্টেম লুপ
            this.run();
        },

        addObject: function(type) {
            this.objects.push({ type, pos: [0, 0, 0], rot: [0, 0, 0] });
            console.log(type + " যোগ করা হয়েছে।");
        },

        run: function() {
            this.update();
            this.render();
            requestAnimationFrame(() => this.run());
        },

        update: function() {
            // ফিজিক্স এবং লজিক আপডেট এখানে
            this.objects.forEach(obj => obj.pos[0] += 0.01);
        },

        render: function() {
            this.gl.clearColor(0.1, 0.1, 0.1, 1.0);
            this.gl.clear(this.gl.COLOR_BUFFER_BIT);
            // এখানে WebGL দিয়ে অবজেক্ট ড্র হবে
        },

        saveProject: async function() {
            const data = JSON.stringify({ version: "1.0", scene: this.objects });
            await fetch('http://localhost:3000/api/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: data
            });
            alert("পুরো প্রজেক্ট সার্ভারে সেভ হয়েছে!");
        }
    };

    // ইঞ্জিন স্টার্ট
    Engine.init();

    // ইনপুট হ্যান্ডলিং
    window.addEventListener('keydown', (e) => {
        console.log("কিপ্রেস করা হয়েছে: " + e.key);
    });
</script>
</body>
</html>
