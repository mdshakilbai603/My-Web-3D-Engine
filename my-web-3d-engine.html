<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>My-Web-3D-Engine</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #toolbar { position: absolute; top: 0; width: 100%; height: 50px; background: #222; display: flex; align-items: center; gap: 15px; padding: 0 20px; z-index: 10; }
        canvas { width: 100vw; height: 100vh; display: block; }
        button { padding: 8px 15px; cursor: pointer; background: #ff4757; border: none; color: white; }
    </style>
</head>
<body>

<div id="toolbar">
    <strong>My-Web-3D-Engine</strong>
    <button onclick="Engine.addObject('Cube')">Add Cube</button>
    <button onclick="Engine.save()">Save Project</button>
</div>
<canvas id="renderCanvas"></canvas>

<script>
    // ইঞ্জিন কোর: এই অংশটি সব ম্যানেজ করবে
    const Engine = {
        gl: document.getElementById('renderCanvas').getContext('webgl'),
        objects: [],
        
        init: function() {
            this.canvas = document.getElementById('renderCanvas');
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
            this.gl.clearColor(0.1, 0.1, 0.1, 1.0);
            this.loop();
        },

        addObject: function(type) {
            this.objects.push({ type: type, x: Math.random(), y: Math.random() });
            console.log("Object Added:", type);
        },

        loop: function() {
            this.gl.clear(this.gl.COLOR_BUFFER_BIT);
            // এখানে সমস্ত ফিজিক্স ও রেন্ডারিং আপডেট হবে
            requestAnimationFrame(() => this.loop());
        },

        save: async function() {
            const data = JSON.stringify(this.objects);
            await fetch('http://localhost:3000/api/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: data
            });
            alert("Project Saved!");
        }
    };

    // ইঞ্জিন স্টার্ট
    Engine.init();
</script>
</body>
</html>
